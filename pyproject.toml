[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-sdinfo"
description = "Native, dependency-free SD/MMC card identity, benchmark and counterfeit detection (Raspberry Pi, macOS, Windows)."
readme = "README.md"
requires-python = ">=3.6"
license = { text = "Apache-2.0" }
authors = [{ name = "Mike Clements" }]
keywords = ["sd-card", "mmc", "raspberry-pi", "benchmark", "counterfeit", "fake-detection", "storage", "f3", "h2testw"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",  # licenscan:allow: canonical PyPI trove classifier for Apache-2.0 — correct packaging practice, not an SPDX id; the SPDX declaration is the `license` field above
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
  "Topic :: Utilities",
]
# No runtime dependencies - standard library only, by design.
dependencies = []
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/mike548141/rpi"
Issues = "https://github.com/mike548141/rpi/issues"

# Dev-only tooling (linting). Never shipped in the wheel; does not touch the zero-runtime-deps rule.
[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
rpi-sdinfo = "rpi_sdinfo.cli:main"
rpi-sdbench = "rpi_sdinfo.bench:main"
rpi-sdverify = "rpi_sdinfo.verify:main"

[tool.setuptools.dynamic]
version = { attr = "rpi_sdinfo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# CI floors at 3.8 (oldest Python GitHub still ships); the code targets 3.6+.
target-version = "py38"
line-length = 110

[tool.ruff.lint]
# E/F/W = pycodestyle + pyflakes, C4 = comprehension cleanups. E501 (line length) is off by
# design: the code carries long prose comments that explain the SD-spec "why". Kept lean on
# purpose - no import-sorting/upgrade rules that would fight the stdlib-minimal, 3.6-floor style.
select = ["E", "F", "W", "C4"]
ignore = ["E501"]
