name: Release

# Builds the sdist + wheel and a CycloneDX SBOM on a version tag, then publishes them as a GitHub Release.
# It deliberately does NOT publish to PyPI - that step is intentionally manual (see ROADMAP / ADR 0005) until
# the "safe to share" review is settled. workflow_dispatch is offered for a dry run on a chosen tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run; no release is published)"
        required: false

permissions:
  contents: write        # needed to create the GitHub Release and upload assets

jobs:
  release:
    name: build + SBOM + release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Guard: the git tag must match the package's single source of truth (__version__), so a release can
      # never ship artifacts whose version disagrees with the code. Skipped on a manual dry run.
      - name: Check tag matches __version__
        if: github.event_name == 'push'
        run: |
          code_version="$(python -c 'import re,pathlib; print(re.search(r"__version__\s*=\s*[\"\x27]([^\"\x27]+)", pathlib.Path("src/rpi_sdinfo/__init__.py").read_text()).group(1))')"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag=$tag_version  __version__=$code_version"
          if [ "$tag_version" != "$code_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $code_version"; exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist

      - name: Generate SBOM (CycloneDX)
        run: python tools/gen_sbom.py -o dist/rpi-sdinfo.cdx.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/rpi-sdinfo.cdx.json
          generate_release_notes: true
          fail_on_unmatched_files: true
