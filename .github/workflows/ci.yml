name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cover all three supported platforms. The test suite is hardware-independent, so this
        # validates that the package imports and the logic + CLI behave on Linux/macOS/Windows -
        # it does NOT exercise the Raspberry Pi sysfs reads in gather_linux() (no SD card in CI).
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          # An extra low-floor check for the oldest Python GitHub still provides.
          - os: ubuntu-latest
            python-version: "3.8"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, no runtime deps)
        run: python -m pip install -e .

      - name: Byte-compile (syntax gate)
        run: python -m compileall -q src

      - name: Run tests
        run: python -m unittest discover -s tests -v
